<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Performance Spotlight</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: none; /* Optional: hide default cursor for immersion */
        }

        .content {
            z-index: 10;
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            /* Glassmorphism */
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #cfc7f8, #ebbbaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #a1a1aa;
            line-height: 1.6;
        }

        /*
         * HIGH PERFORMANCE OPTIMIZATION
         * Instead of redrawing a gradient on the body (Paint operation),
         * we move a fixed element using transform (Composite operation).
         * This runs on the GPU and is independent of the main thread layout.
         */
        #spotlight-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 500px; /* Reduced from 1200px */
            height: 500px;
            
            /* Center the element on its 0,0 coordinate so we can just translate to mouse X,Y */
            margin-left: -250px; 
            margin-top: -250px;
            
            background: radial-gradient(
                circle closest-side, 
                rgba(255, 255, 255, 0.08), 
                transparent 100%
            );
            
            pointer-events: none;
            z-index: 1;
            
            /* Crucial for performance hint */
            will-change: transform;
        }

        /* Optional interaction trigger: brighten when clicking */
        body:active #spotlight-cursor {
            background: radial-gradient(
                circle closest-side, 
                rgba(255, 255, 255, 0.2), 
                transparent 100%
            );
            transition: background 0.2s; /* safe to transition background opacity */
        }
    </style>
</head>
<body>

    <!-- The moving spotlight element -->
    <div id="spotlight-cursor"></div>

    <div class="content">
        <h1>Silky Smooth Spotlight</h1>
        <p>
            This version uses <strong>GPU Acceleration</strong>.
            <br>
            Instead of updating background variables (which triggers repaints), 
            we move a dedicated layer using <code>transform: translate3d()</code>.
        </p>
    </div>

    <script>
        const cursor = document.getElementById('spotlight-cursor');
        
        // Optimizing with requestAnimationFrame is good practice, 
        // but for lowest input latency, direct updates can feel snappier 
        // if the work is minimal.
        // We will use a hybrid approach: update transform directly but efficiently.
        
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        // Initialize position
        cursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;

        window.addEventListener('mousemove', (e) => {
            // Using translate3d forces hardware acceleration
            // Updating the style directly here is often fast enough for this specific effect
            // because it only triggers the Compositor thread.
            cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        }, { passive: true });
        
        // Handle resizing to keep experience consistent if needed
        window.addEventListener('resize', () => {
           // optional logic if spotlight size depends on screen
        });
    </script>
</body>
</html>
