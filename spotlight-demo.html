<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotlight Effect Demo</title>
    <style>
        :root {
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d; /* Dark background */
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* The Content */
        .content {
            z-index: 2;
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            /* Glassmorphism card for better contrast */
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #cfc7f8, #ebbbaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #a1a1aa;
            line-height: 1.6;
        }

        /* 
         * THE SPOTLIGHT EFFECT 
         * This element overlays the entire screen.
         * It uses a radial gradient centered at --mouse-x, --mouse-y.
         */
        .spotlight-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Crucial: lets mouse clicks pass through */
            z-index: 1;

            /* 
             * Implementation Strategy:
             * Create a gradient that is transparent in the rest of the screen,
             * but has a localized "glow" at the mouse position.
             */
            background: radial-gradient(
                600px circle at var(--mouse-x) var(--mouse-y),
                rgba(255, 255, 255, 0.15),
                transparent 40%
            );
        }

        /* Optional: Add a subtle grain or noise for texture if desired */
        .spotlight-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }
    </style>
</head>
<body>

    <div class="spotlight-overlay" id="spotlight"></div>

    <div class="content">
        <h1>Victrays Spotlight Effect</h1>
        <p>
            Move your mouse around to see the effect. <br>
            This is implemented using CSS Variables and Radial Gradients.
        </p>
    </div>

    <script>
        const updateSpotlight = (e) => {
            // Get mouse coordinates
            const x = e.clientX;
            const y = e.clientY;

            // Update CSS variables on the root element
            document.documentElement.style.setProperty('--mouse-x', `${x}px`);
            document.documentElement.style.setProperty('--mouse-y', `${y}px`);
        }

        // Add event listener to the window
        window.addEventListener('mousemove', updateSpotlight);
    </script>
</body>
</html>
